[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lshbloom-pes2o"
version = "0.1.0"
description = "Evaluate MinHashLSH and LSHBloom deduplication for peS2o continued pretraining."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasketch[bloom]==2.0.0",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.8,<4",
]
dev = [
    "matplotlib>=3.8,<4",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[project.urls]
Repository = "https://github.com/Calista0429/LSHBloom-peS2o"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
